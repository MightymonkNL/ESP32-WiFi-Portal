; ESP32-Portal — WiFi accesspoint met captive landing page
; Doelbord: Waveshare ESP32-S3-Touch-AMOLED-1.8 (16MB flash, 8MB PSRAM,
; 368x448 AMOLED: SH8601 of CO5300, wordt bij opstarten automatisch herkend).

[env:waveshare-esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Native USB-poort voor serieel/flashen
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; ESP32-S3R8: 8MB octale PSRAM (nodig voor de schermbuffer van 368x448)
board_build.arduino.memory_type = qio_opi

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.8
    olikraus/U8g2 @ ^2.35.9       ; alleen voor de lettertypes

monitor_speed = 115200
upload_speed = 921600
