; Template — an empty project for the ESP32 Toolbox.
; Copy this folder to projects/<your-project>, change APP_ID in src/main.cpp and
; add a module for it in admin/modules (copy admin/modules/template).
;
; Keep the same board settings and partition table as the portal
; (default_16MB.csv): then switching projects keeps the WiFi settings (NVS)
; and the files (LittleFS) of the other project on the board.

[env:waveshare-esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

lib_deps =
    symlink://../../lib/BoardLink    ; shared USB protocol for the ESP32 Toolbox

monitor_speed = 115200
upload_speed = 921600
